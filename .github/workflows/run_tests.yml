name: E2E Regression Suite

on:
  # Changes to this repository's own framework or test code.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fired by the target site's repository (apolskiy.github.io) whenever its
  # .html, .css, or .js sources are deployed, so the suite validates the new
  # build immediately rather than on the next nightly run.
  repository_dispatch:
    types: [site-deployed]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser engine to execute against
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_URL: https://apolskiy.github.io/
  AI_DIAGNOSTICS_ENABLED: ${{ vars.AI_DIAGNOSTICS_ENABLED || 'false' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}

jobs:
  static-analysis:
    name: Pylint (10/10 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce a perfect Pylint score
        run: python -m pylint --fail-under=10 config pages utils tests conftest.py

  e2e:
    name: E2E (${{ inputs.browser || matrix.browser }})
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled and event-driven runs execute on Chromium. A manual
        # workflow_dispatch overrides the engine via the `browser` input.
        browser: [chromium]
    env:
      TARGET_BROWSER: ${{ inputs.browser || matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser and OS dependencies
        run: python -m playwright install --with-deps ${{ env.TARGET_BROWSER }}

      - name: Run the E2E suite
        id: run_tests
        # Never short-circuit artefact upload: a failing run is exactly the run
        # whose screenshots, DOM snapshots, and AI triage notes matter most.
        continue-on-error: true
        run: python -m pytest --browser=${{ env.TARGET_BROWSER }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.TARGET_BROWSER }}
          path: allure-results/
          retention-days: 30

      - name: Upload Pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ env.TARGET_BROWSER }}
          path: reports/
          retention-days: 30

      - name: Publish the suite outcome
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "::error::The E2E suite failed on ${{ env.TARGET_BROWSER }}. \
          Download the 'allure-results-${{ env.TARGET_BROWSER }}' artefact for the \
          failure screenshots, DOM snapshots, and Claude root-cause analysis."
          exit 1
