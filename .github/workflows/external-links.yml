name: Outbound Link Check

# Resolves every off-site target the portfolio advertises, to catch a renamed,
# deleted, or newly private repository that the page still links to.
#
# Deliberately NOT part of the deployment pipeline. Link rot happens over
# months, so checking it on every push would put GitHub and Docker Hub in the
# critical path of a deploy signal, and would generate enough request pressure
# to trip rate limiting on its own - producing 429s on an arbitrary subset of
# the batch and turning a slow-moving concern into a source of noise.
on:
  schedule:
    # Mondays, 06:00 UTC. Frequent enough that a dead link is caught in days,
    # rare enough that it costs almost nothing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A scheduled run and a manual one must never resolve the same links at the
# same time; that request pressure is the thing this workflow avoids.
concurrency:
  group: outbound-link-check
  cancel-in-progress: false

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create Artifact Directories
        run: |
          mkdir -p reports allure-results

      - name: Resolve Every Published Outbound Link
        run: |
          # Only the external-marked tests. No deployment gate is needed: this
          # checks where the links point, not what the latest deploy rendered.
          pytest -m external

      - name: Upload Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: outbound-link-report
          path: |
            reports/
