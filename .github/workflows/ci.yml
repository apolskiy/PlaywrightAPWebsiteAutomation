name: Playwright CI & E2E Regression Suite

# Prevent concurrent executions from stepping on each other:
# New runs will queue up and wait until the current active run finishes.
concurrency:
  group: playwright-e2e-execution
  cancel-in-progress: false

on:
  # 1. Runs when automation code/scripts in this repo are pushed/merged to main
  push:
    branches: [ main ]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'utils/**'
      - 'config/**'
      - 'pytest.ini'
      - 'requirements.txt'

  # 2. Runs when apolskiy.github.io notifies this repo of website updates
  repository_dispatch:
    types: [ website_updated ]

  # 3. Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Delay step to ensure GitHub Pages deployment completes on the live site
      - name: Wait for GitHub Pages Deployment to Propagate
        run: |
            echo "Polling https://apolskiy.github.io/ for deployment readiness..."
            MAX_RETRIES=15
            RETRY_COUNT=0
            
            until [ $RETRY_COUNT -ge $MAX_RETRIES ]
            do
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://apolskiy.github.io/)
              if [ "$STATUS" -eq 200 ]; then
                echo "Live site is up and returning 200 OK."
                break
              fi
              echo "Site returning status $STATUS. Waiting 10s... (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT+1))
            done
            
            # Additional safety buffer for CDN cache propagation
            sleep 15

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Pylint Code Quality Checks
        run: |
          pylint pages/ tests/ utils/ config/ || echo "Pylint checks completed."

      - name: Execute Playwright Suite & Crawl Routes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Upload Test Artifacts & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-reports
          path: |
            reports/
            allure-history/
            test-results/