name: Playwright CI & E2E Regression Suite

# Automatically cancel any outdated/in-flight run on the same branch or dispatch event
# so only the latest push/deploy actually executes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'utils/**'
      - 'config/**'
      # conftest.py holds every fixture and the failure-diagnostics hook, so a
      # change there can alter the outcome of the whole suite.
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'

  repository_dispatch:
    types: [ website_updated ]

  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the development interpreter in requirements.txt, so a
          # version-specific failure surfaces locally rather than only in CI.
          python-version: '3.14'

      - name: Wait for GitHub Pages Deployment
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An HTTP 200 is NOT proof of freshness: the previously deployed build
          # answers 200 just as happily. The old poll therefore succeeded on its
          # first attempt while a deployment was still running, and the suite went
          # on to test a moving target - early tests saw the old markup and later
          # ones saw the new, which is exactly how a passing locator can time out
          # in the same run.
          #
          # Gate on two real signals instead:
          #   1. the site repository has no Pages deployment in flight, and
          #   2. the served page reports the same ETag on consecutive polls, so
          #      the CDN edge has settled on one version.
          SITE_API="https://api.github.com/repos/apolskiy/apolskiy.github.io/actions/runs"
          SITE_URL="https://apolskiy.github.io/"

          count_runs() {
            # Number of site deployments in the given state; 0 if the API is
            # unreachable, so an API hiccup never blocks the pipeline.
            curl -sf -H "Authorization: Bearer ${GH_API_TOKEN}" "${SITE_API}?status=$1" 2>/dev/null \
              | python -c "import json,sys; print(json.load(sys.stdin).get('total_count',0))" 2>/dev/null \
              || echo 0
          }

          echo "1/2 Waiting for any in-flight GitHub Pages deployment to finish..."
          for _ in $(seq 1 30); do
            ACTIVE=$(count_runs in_progress)
            PENDING=$(count_runs queued)
            if [ "$ACTIVE" -eq 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "    no deployment in flight"
              break
            fi
            echo "    deployment in flight (in_progress=${ACTIVE} queued=${PENDING}); waiting 10s"
            sleep 10
          done

          echo "2/2 Waiting for the served page to settle at one version..."
          PREVIOUS=""
          STABLE=0
          for _ in $(seq 1 24); do
            CURRENT=$(curl -sI "$SITE_URL" | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}')
            if [ -n "$CURRENT" ] && [ "$CURRENT" = "$PREVIOUS" ]; then
              STABLE=$((STABLE + 1))
            else
              STABLE=0
            fi
            PREVIOUS="$CURRENT"
            if [ "$STABLE" -ge 2 ]; then
              echo "    page settled at ETag ${CURRENT}"
              break
            fi
            sleep 5
          done

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create Artifact Directories
        run: |
          mkdir -p reports allure-results test-results

      - name: Run Pylint Code Quality Checks
        run: |
          # Blocking gate. The suite is held at 10.00/10, so a regression must
          # fail the pipeline rather than print a warning into a log nobody
          # reads. conftest.py is included: it is the largest single source file
          # in the framework and was previously unchecked.
          python -m pylint --fail-under=10 config pages utils tests conftest.py

      - name: Execute Playwright Suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # `external` tests reach third-party hosts and are deselected here on
          # purpose: a deploy signal must depend on this site alone, not on
          # GitHub or Docker Hub being reachable from the runner. They run on a
          # schedule instead - see external-links.yml.
          pytest -m "not external"

      - name: Set up Java JDK
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Allure CLI
        if: always()
        run: |
          ALLURE_VERSION="2.29.0"
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o reports/allure-report

      - name: Upload Test Artifacts & Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: execution-reports
          path: |
            reports/
            allure-history/
            test-results/