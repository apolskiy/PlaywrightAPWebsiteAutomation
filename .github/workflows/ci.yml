name: Playwright CI & E2E Regression Suite

concurrency:
  group: playwright-e2e-execution
  cancel-in-progress: false

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'utils/**'
      - 'config/**'
      - 'pytest.ini'
      - 'requirements.txt'

  repository_dispatch:
    types: [ website_updated ]

  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait for GitHub Pages Deployment
        run: |
          echo "Polling https://apolskiy.github.io/ for deployment readiness..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://apolskiy.github.io/)
            if [ "$STATUS" -eq 200 ]; then
              echo "Live site is up and returning 200 OK."
              break
            fi
            echo "Site returning status $STATUS. Waiting 10s..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          sleep 10

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create Artifact Directories
        run: |
          mkdir -p reports allure-results test-results

      - name: Run Pylint Code Quality Checks
        run: |
          pylint pages/ tests/ utils/ config/ || echo "Pylint completed with warnings."

      - name: Execute Playwright Suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Upload Test Artifacts & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-reports
          path: |
            reports/
            allure-history/
            test-results/