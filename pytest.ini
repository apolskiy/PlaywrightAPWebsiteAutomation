[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `--strict-markers` is on, so every marker must be declared here.
markers =
    external: reaches third-party hosts. Deselected on the deployment path
        (`-m "not external"`) so a deploy signal never depends on GitHub or
        Docker Hub being reachable, and run on a schedule instead - link rot is
        a monthly problem and does not belong in a per-push pipeline.

# Allure results and a standalone HTML summary in one run.
#
# `--browser` is deliberately NOT set here. pytest-playwright treats the flag as
# repeatable, so a value in addopts is additive rather than overridable: pinning
# chromium here would make `--browser=firefox` run BOTH engines. Chromium is
# already pytest-playwright's default, so omitting the flag gives the same
# default run while letting the command line select the engine outright.
addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=allure-results
    --clean-alluredir
    --html=reports/pytest-report.html
    --self-contained-html

# Fail the run on any warning the suite itself can fix, while tolerating
# deprecation noise emitted by third-party dependencies.
filterwarnings =
    error
    ignore::DeprecationWarning:playwright.*
    ignore::DeprecationWarning:allure_commons.*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
